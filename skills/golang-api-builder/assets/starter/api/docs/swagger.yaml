          schema:
            $ref: '#/definitions/general.DefaultHttpResponse'
      summary: Health check
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Client-provided user JWT containing information to be extracted from
    in: header
    name: Authorization
    type: apiKey
