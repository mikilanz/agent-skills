[package]
name = "rust-api-starter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-api-starter"
path = "src/main.rs"

[lib]
name = "rust_api_starter"
path = "src/lib.rs"

[dependencies]
actix-cors = "0.7"
actix-multipart = "0.8"
actix-web = "4"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["postgres", "r2d2", "chrono", "uuid"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
dotenvy = "0.15"
env_logger = "0.11"
futures = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
log = "0.4"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.15"
utoipa = { version = "6", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
mockall = "0.15"
