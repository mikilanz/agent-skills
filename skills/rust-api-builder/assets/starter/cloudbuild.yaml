# Branch build (staging): build, push, deploy cloudbuild-app.yaml to GKE.
# Replace <region>, <project>, <repository>, <cluster> and <service>.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "<region>-docker.pkg.dev/<project>/<repository>/<service>:$BRANCH_NAME", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "<region>-docker.pkg.dev/<project>/<repository>/<service>:$BRANCH_NAME"]
  - name: "gcr.io/cloud-builders/gke-deploy"
    args:
      - run
      - --filename=cloudbuild-app.yaml
      - --location=<region>
      - --cluster=<cluster>
      - --image=<region>-docker.pkg.dev/<project>/<repository>/<service>:$BRANCH_NAME
tags: ["$BRANCH_NAME"]
options:
  machineType: "E2_HIGHCPU_8"
timeout: 1200s
