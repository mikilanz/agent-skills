services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@db:5432/rust_api_starter
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rust_api_starter
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
